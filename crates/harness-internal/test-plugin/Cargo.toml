[package]
name = "harness-test-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A dynamic library, so the loader's end-to-end tests have a real Plugin to
# open, and an rlib, so this crate's own tests link its entry point.
[lib]
crate-type = ["cdylib", "rlib"]

# No `[dependencies]` of any kind: a library Plugin needs nothing from Runvil,
# and this fixture proves it.

# Only the end-to-end tests in `tests/it` use these: the loader to insert
# the built library, the Plugin contract crate for `PackRegistry::new`,
# `libloading` to open the library the loader already holds and read its
# counters, and the Harness facade with tokio to run a prompt that calls
# the fixture's tools.
[dev-dependencies]
harness-plugin-loader.workspace = true
libloading.workspace = true
runvil.workspace = true
runvil-plugin.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

# `RTLD_NOLOAD`, so the end-to-end tests can ask whether a library is still
# loaded without loading it.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
