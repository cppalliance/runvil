[package]
name = "harness-test-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A dynamic library, so the loader's end-to-end tests have a real Plugin to
# open, and an rlib, so this crate's own tests link its entry point.
[lib]
crate-type = ["cdylib", "rlib"]

# No dependencies of any kind: a library Plugin needs nothing from Runvil,
# and this fixture proves it. The Harness may name no `build-*` crate, so
# `build.rs` includes the file-size check's source instead.

[lints]
workspace = true
