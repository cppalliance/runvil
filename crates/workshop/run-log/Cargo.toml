[package]
name = "workshop-run-log"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The one crate a Host depends on: the recorder trait and the record
# values the log stores and returns, and the error a run ends with and
# its code, which the log stores and rebuilds. The fidelity suite also
# round-trips a run's events through the log.
runvil.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
turso.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
