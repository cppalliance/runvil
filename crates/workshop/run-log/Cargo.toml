[package]
name = "workshop-run-log"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The recorder trait and the record values the log stores and returns,
# through the Harness's public API.
harness.workspace = true
# The Engine's public API: the error a run ends with and its code, which
# the log stores and rebuilds, since `harness::record` re-exports neither.
# The fidelity suite also round-trips the Engine's events through the log.
runvil.workspace = true
serde_json.workspace = true
shared-error-source = { workspace = true, features = ["database", "json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
turso.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
