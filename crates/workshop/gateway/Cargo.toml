[package]
name = "workshop-gateway"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-fixtures = [
    "dep:tempfile",
    "workshop-gateway-discovery/test-fixtures",
    "workshop-support/test-fixtures",
]

[dependencies]
arc-swap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
workshop-gateway-discovery.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-support.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The gateway's tests call `workshop_support::fixtures::serve`; enabling the
# feature here (not only through the crate's own `test-fixtures` feature)
# keeps `cargo test -p workshop-gateway` compiling without `--all-features`.
workshop-support = { workspace = true, features = ["test-fixtures"] }
# The discovery fork's `test-fixtures` feature supplies the `gateway.json`
# writer and the process lease Workshop's test doubles need.
workshop-gateway-discovery = { workspace = true, features = ["test-fixtures"] }

[build-dependencies]
build-ceiling.workspace = true
serde_json.workspace = true

[lints]
workspace = true
