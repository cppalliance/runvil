[package]
name = "workshop-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `SearchProvider`, which the agent sessions' Gateway search implements,
# is an `async_trait` trait.
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
# The one crate a Host depends on: each conversation's launch builds the
# per-run Harness that runs it, the agent socket frames a run's events as
# transcript entries and the status reporter derives status from them,
# the prompt parser sits behind the `/prompts/contract` route, and the
# agent sessions provide the server's runtime under the Plugin
# contract's tokio runtime service name.
runvil.workspace = true
# The Gateway web search client the agent sessions' search provider
# sends each search through.
harness-gateway-client.workspace = true
# The web Pack every agent run's Host installs: `runvil/web`, with the
# search-provider and runtime services it reads.
plugin-web.workspace = true
# The MCP client Pack, installed once over every server of the
# configured `mcp.json`.
plugin-mcp.workspace = true
# The std Plugin's dynamic library, which holds the file-tool Pack
# `runvil/std`. Nothing here links it in or calls it: the dependency makes
# Cargo build the library with every build of the server, into `deps`
# beside the test executables, and the server loads it from its Plugin
# directory like any other library Plugin.
workshop-plugin-std.workspace = true
# The bashkit Plugin's dynamic library, which holds the shell Pack
# `runvil/bash`. Like std's, it is here only so that Cargo builds it.
workshop-plugin-bashkit.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
# The conversation layer: the conversation table, transcripts, agent
# discovery, and the recorder tee each run writes through.
workshop-agents.workspace = true
workshop-gateway.workspace = true
workshop-menu.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-run-log.workspace = true
workshop-status.workspace = true
workshop-support.workspace = true
workshop-user-state.workspace = true
workshop-workspace.workspace = true
tempfile = { workspace = true, optional = true }

[features]
default = []
test-fixtures = [
    "dep:tempfile",
    "workshop-gateway/test-fixtures",
    "workshop-support/test-fixtures",
    "workshop-workspace/test-fixtures",
]

[dev-dependencies]
workshop-server = { path = ".", features = ["test-fixtures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

# The build script bundles the UI with esbuild into OUT_DIR through the
# shared helper; nothing UI-built lands in the repository.
[build-dependencies]
build-ui = { path = "../../build-ui" }

[lints]
workspace = true

# Not released through cargo-dist; the gateway is the only disted package
# (see dist-workspace.toml).
[package.metadata.dist]
dist = false
