[package]
name = "workshop-gateway-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "The Gateway discovery contract as Workshop reads it: gateway.json, the launch election, stale detection, and authenticated shutdown"

[dependencies]
serde.workspace = true
serde_json.workspace = true
shared-error-source = { workspace = true, features = ["json"] }
thiserror.workspace = true

# Process-image lookup for stale detection (src/sys/macos.rs): proc_pidpath.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Process-image lookup for stale detection (src/sys/windows.rs):
# OpenProcess + QueryFullProcessImageNameW.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[features]
# The writer half, which Workshop ships only in test builds: a test double
# writes a contract-shaped `gateway.json` and holds a process lease. No
# production Workshop code writes the file; the Gateway owns that.
test-fixtures = []

[dev-dependencies]
tempfile.workspace = true
# The crate's own `test-fixtures` feature, so `cargo test -p
# workshop-gateway-discovery` compiles the writer half its unit tests drive
# without `--all-features`.
workshop-gateway-discovery = { path = ".", features = ["test-fixtures"] }

[build-dependencies]
build-ceiling.workspace = true

[lints]
workspace = true
