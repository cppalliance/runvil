[package]
name = "workshop-agents"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The Harness's public API: the per-run Harness a conversation drives, its
# control, and the recorder tee's trait.
runvil.workspace = true
# The Engine's public API: the events a conversation observes, and the
# round ids its deltas and transcript stamp.
runvil-engine.workspace = true
# Conversation ids are 128 bits from the OS CSPRNG: unguessable by
# anything that has not seen the acknowledging frame.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` for the conversation's broadcasts and state watch; `time` for the
# timer every run sleeps on; `rt` for the blocking pool a conversation
# parses its agent on.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# The discovery suite seeds an agents directory on disk.
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
