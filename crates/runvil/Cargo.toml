[package]
name = "runvil"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Every crate a `pub use` names. The Harness's items come from the two
# Harness crates that define them. The Engine's items come through the
# `runvil-engine` facade, their one public path, and the Plugin
# contract's items from `runvil-plugin`.
[dependencies]
harness-plugin-loader.workspace = true
harness-runner.workspace = true
runvil-engine.workspace = true
runvil-plugin.workspace = true

# The suite and the `run-prompt` example run a Host on tokio, as a real
# Host does; the facade's own items name no tokio type.
[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }

[lints]
workspace = true
