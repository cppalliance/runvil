[package]
name = "build-xtask"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
proc-macro2.workspace = true
pulldown-cmark.workspace = true
rustdoc-types.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The cross-half discovery conformance check (tests/discovery_conformance.rs):
# it runs the Gateway's real writer and Workshop's forked reader against each
# other while both halves still live in this workspace. This is the one
# place allowed to name both, and it disappears when the Gateway moves to
# its own repository.
gateway-api-discovery = { workspace = true, features = ["test-fixtures"] }
workshop-gateway-discovery = { workspace = true, features = ["test-fixtures"] }

[build-dependencies]
build-ceiling.workspace = true

[lints]
workspace = true
