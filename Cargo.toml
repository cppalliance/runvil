[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/runvil"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
# Cross-platform Ctrl-C handling for the installer build.
ctrlc = "3.5"
# `cargo installer manifest` checks each updater signature as the Tauri
# updater does: 0.2.5 is the release Workshop's `tauri-plugin-updater`
# verifies with.
minisign-verify = "0.2.5"
# Signs the manifest tests' fixtures with a key generated per run. A
# dev-dependency only: the release key never leaves CI.
minisign = "0.9"
# `span-locations` makes a span parsed outside a proc macro report its line,
# which the structural checks print with every violation.
proc-macro2 = { version = "1", features = ["span-locations"] }
# default-features off: build-xtask's doctest scan reads only the core
# event stream, never the `html` renderer or the `getopts` binary.
pulldown-cmark = { version = "0.12", default-features = false }
serde_json = "1"
sha2 = "0.11"
# Parses each crate's sources for build-xtask's structural checks; `full`
# is the feature that parses items.
syn = { version = "3", features = ["full"] }
tempfile = "3"
toml = "1"

# The dylint libraries `cargo dylint --all` runs. The lints live in their
# own repository, shared across the runvil project, because they build on
# their own nightly with `rustc_private`. Moving to a newer lint set is a
# change of `rev`.
[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/cppalliance/dylints", rev = "982b297ede90d37cdf8f3bf9995d1d706dcc51d4" }]

# The Workshop commit the installers are built from. Workshop is its own
# product in its own repository, and `cargo installer` builds the checkout
# `RUNVIL_WORKSHOP` names, which `installers.yml` takes at this commit.
# Moving to a newer Workshop is a change of `rev`, together with the
# workspace version above and `rust-toolchain.toml` when Workshop changed
# either: `cargo installer` refuses a checkout whose version or toolchain
# differs from this workspace's.
[workspace.metadata.workshop]
git = "https://github.com/cppalliance/runvil-workshop"
rev = "623eb7aa33c84fb3ceb7fc1628845120f607dfb7"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Cherry-picked out of pedantic: it flags product names (Runvil, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
# Cherry-picked out of pedantic: its suggested rewrite for a collection is
# `assert_eq!(x, [] as [T; 0])`, which has to spell out the element type and
# needs `T: PartialEq + Debug`, so it cannot be applied to most call sites.
assert_is_empty = "allow"
