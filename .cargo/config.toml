# Link the Windows Rust binary and cc-built support crates with the static
# CRT. Runtime-loaded native libraries keep their own CRT boundary.
# rust-lld ships in the toolchain and links several times faster than the
# stock MSVC linker; it resolves from the rustlib bin directory by name.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
installer = "run -p build-installer --"
xtask = "run -p build-xtask --"
# Outlines the workspace with the vibelight checkout next to this repo. Cargo
# builds it in release mode on first use and rebuilds it when its source
# changes. Run it from the repo root: the path is relative to the cwd.
#
# The name is `outline`, not `vibelight`, on purpose. Cargo resolves an alias
# before an installed subcommand, warns that the alias shadows it, and plans to
# make that a hard error, so an alias named `vibelight` would break every
# `cargo install vibelight` user. With this name the checkout stays the default
# here, and `cargo vibelight` runs whichever version is installed.
outline = "run --release --bin vibelight --manifest-path ../vibelight/Cargo.toml --"

# Clippy appends a docs-link line to every diagnostic; the lint name already
# identifies it.
[env]
CLIPPY_DISABLE_DOCS_LINKS = "1"
# The runvil-workshop checkout `cargo installer` builds from and its tests
# read: the one next to this repo, unless the variable is already set. The
# path is relative to this file's parent's parent, and Cargo passes it on
# as an absolute path.
RUNVIL_WORKSHOP = { value = "../runvil-workshop", relative = true }
