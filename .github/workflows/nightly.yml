name: Nightly

# Phase 1 (fork testing): triggered on push and dispatch so we iterate
# fast. Phase 2 (upstream): swap the trigger to schedule + fork guard.
#
# Builds the five Workshop installers and publishes them as the rolling
# `nightly` release. The Gateway is a separate product with its own
# releases; each installer here carries the binary `gateway-pin/pin.json`
# names.
on:
  push:
    branches: [master]
  # A plain dispatch still no-ops when `nightly` already points at HEAD.
  # Set `force` to rebuild the same commit anyway.
  workflow_dispatch:
    inputs:
      force:
        description: Build even when HEAD already carries the nightly tag
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Exit early when master hasn't moved since the last nightly, unless the
  # dispatch asked for a rebuild.
  check:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.compare.outputs.should-build }}
      short-sha: ${{ steps.compare.outputs.short-sha }}
      date: ${{ steps.compare.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compare
        env:
          # A dispatch sets this to the string `true` or `false`; every other
          # trigger leaves it empty, so an empty value reads as "not forced".
          FORCE: ${{ github.event.inputs.force }}
        run: |
          nightly_sha=$(git rev-parse nightly^{} 2>/dev/null || echo "none")
          head_sha=$(git rev-parse HEAD)
          short=$(echo "$head_sha" | head -c 7)
          date=$(date -u +%Y-%m-%d)
          echo "short-sha=$short" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then
            echo "Forced rebuild of $head_sha; the nightly tag is ignored."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          elif [ "$nightly_sha" = "$head_sha" ]; then
            echo "No new commits since the last nightly ($short), skipping."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits: nightly was $nightly_sha, HEAD is $head_sha"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  # -- Workshop: Windows, macOS ARM, macOS Intel, Linux x64 and ARM64 ----

  workshop:
    needs: check
    if: needs.check.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            args: ""
            suffix: win-x64
          - name: macos-arm
            runs-on: macos-latest
            args: "--target aarch64-apple-darwin"
            suffix: macos-arm64
          - name: macos-intel
            runs-on: macos-latest
            args: "--target x86_64-apple-darwin"
            suffix: macos-x64
          - name: linux
            runs-on: ubuntu-22.04
            args: ""
            suffix: linux-x64
          - name: linux-arm
            runs-on: ubuntu-22.04-arm
            args: ""
            suffix: linux-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Add the Rust target
        if: matrix.name == 'macos-arm' || matrix.name == 'macos-intel'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/workshop/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/workshop
        run: npm ci

      - name: Install Tauri system packages
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler shells out to xdg-open, which the
          # ARM runner images do not preinstall (the x64 image does).
          # https://github.com/tauri-apps/tauri-action/issues/1319
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev xdg-utils

      # tauri.conf.json ships the gateway via bundle.externalBin, which
      # resolves binaries/runvil-gateway-<target-triple> at bundle
      # time; stage the pinned release binary before tauri-action runs.
      #
      # gateway-pin/pin.json must name a published Gateway release before
      # this job can run: the fetch verifies the asset's sha256 against the
      # pin and refuses a placeholder. Fill it with
      # `node tools/bump-gateway.mjs <tag>`.
      - name: Stage the pinned Gateway sidecar
        shell: bash
        run: |
          set -e
          case "${{ matrix.name }}" in
            windows)     triple="x86_64-pc-windows-msvc";   ext=".exe" ;;
            macos-arm)   triple="aarch64-apple-darwin";     ext="" ;;
            macos-intel) triple="x86_64-apple-darwin";      ext="" ;;
            linux)       triple="x86_64-unknown-linux-gnu"; ext="" ;;
            linux-arm)   triple="aarch64-unknown-linux-gnu"; ext="" ;;
          esac
          node tools/fetch-gateway-sidecar.mjs --target "$triple"
          staged="crates/workshop/desktop/binaries/runvil-gateway-$triple$ext"
          [ -f "$staged" ] || { echo "no staged sidecar at $staged"; exit 1; }

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: crates/workshop/desktop
          args: ${{ matrix.args }} --config tauri.nightly.conf.json

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: workshop-nightly-${{ matrix.suffix }}
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/dmg/*.dmg
            target/**/bundle/deb/*.deb
            target/**/bundle/appimage/*.AppImage
          if-no-files-found: error

  # -- Publish: rolling nightly release ----------------------------------

  publish:
    needs: [check, workshop]
    if: needs.check.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    env:
      DATE: ${{ needs.check.outputs.date }}
      SHORT_SHA: ${{ needs.check.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: SHA256SUMS
        working-directory: dist
        run: |
          shopt -s globstar nullglob
          sha256sum **/*.exe **/*.dmg **/*.deb **/*.AppImage 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS

      - name: Delete the previous nightly release
        run: gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the nightly release
        run: |
          shopt -s globstar nullglob
          gh release create nightly \
            --title "Nightly ($DATE, $SHORT_SHA)" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automated nightly build from master at $SHORT_SHA ($DATE). Not a stable release." \
            dist/**/*.exe dist/**/*.dmg dist/**/*.deb dist/**/*.AppImage dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
