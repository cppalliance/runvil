# cargo-deny configuration for the Runvil (BSL-1.0) workspace.
# Run locally with `cargo deny check`; CI runs the same. See RV-ROOT-008.

[graph]
# Check the dependency graph with all features enabled, not just the defaults.
all-features = true

[advisories]
version = 2
# Vulnerabilities and yanked crates always fail. "unmaintained" is scoped to
# crates this workspace depends on directly, so we are accountable for our own
# choices without failing CI on unmaintained deep-transitive crates we cannot
# control.
unmaintained = "workspace"
yanked = "deny"
# Reviewed advisories consciously accepted go here, each with a rationale.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with distributing a BSL-1.0 workspace.
allow = [
    "BSL-1.0",
    "MIT",
    "Apache-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Warn on duplicate versions of the same crate so unification regressions are
# visible without hard-failing a large native-dependency graph.
multiple-versions = "warn"
wildcards = "warn"
# Workspace crates are all `publish = false` and reference each other by path,
# which cargo-deny otherwise reports as wildcard dependencies.
allow-wildcard-paths = true

# JSON that reaches a recorder or a replay comparison must round-trip with
# canonical (sorted) object keys, which `preserve_order` would replace with
# insertion order for every crate in the graph.
[[bans.features]]
crate = "serde_json"
deny = ["preserve_order"]

[sources]
# Only crates.io is an allowed registry, and no git source is allowed:
# every dependency of this workspace comes from the registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
